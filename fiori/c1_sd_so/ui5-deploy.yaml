# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "3.1"
metadata:
  name: c1.sd.c1sdso
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: http://bgissap1.bgissap.co.kr:8000
        app:
          name: ZC1SDSO
          description: SD 판매오더 변경이력 조회
          package: ZPC1MM
          transport: EFXK902695
        exclude:
          - /test/
